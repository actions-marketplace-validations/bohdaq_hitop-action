name: Run HITOP collection
description: Run a HITOP API collection in CI, upload the JUnit report and write a job summary.
author: Bohdan Tsap
branding:
  icon: check-circle
  color: purple

inputs:
  version:
    description: >
      hitop version to run, the tag of ghcr.io/bohdaq/hitop (for example 0.3.0-rc.2). Required:
      pin a version so a new hitop release never changes your pipeline.
    required: true
  path:
    description: Collection folder (or a collection name in global storage), relative to the workspace.
    required: false
    default: .
  env:
    description: Environment name from the folder's environments/ directory (hitop --env).
    required: false
    default: ""
  env-file:
    description: Environment file from anywhere in the workspace (hitop --env-file). Conflicts with env.
    required: false
    default: ""
  reporter:
    description: Comma separated reporters (cli, junit, json). The job summary needs json, the artifact needs junit.
    required: false
    default: cli,junit,json
  out:
    description: Report folder, relative to the workspace (hitop --out).
    required: false
    default: hitop-reports
  secrets:
    description: >
      Secret variables, one NAME=value per line, passed as hitop --secret NAME=value and masked
      in the log. Environment variables named HITOP_SECRET_<ENV>_<NAME> (and every other HITOP_*
      variable) set on the step are passed to hitop too.
    required: false
    default: ""
  vars:
    description: Variables, one key=value per line, passed as hitop --var key=value. Not masked, so never put secrets here.
    required: false
    default: ""
  args:
    description: Extra hitop run arguments, split on whitespace (for example --bail --timeout 5000).
    required: false
    default: ""
  artifact-name:
    description: Name of the uploaded JUnit artifact. Empty skips the upload.
    required: false
    default: hitop-junit
  summary:
    description: Write a job summary from report.json (true or false).
    required: false
    default: "true"

outputs:
  exit-code:
    description: hitop's exit code. 0 every request passed, 1 a request or assertion failed, 2 usage or configuration error.
    value: ${{ steps.run.outputs.exit-code }}
  passed:
    description: true when every request passed.
    value: ${{ steps.run.outputs.passed }}
  report-dir:
    description: The report folder (absolute path).
    value: ${{ steps.run.outputs.report-dir }}
  junit-file:
    description: Path of junit.xml, empty when it was not written.
    value: ${{ steps.run.outputs.junit-file }}
  report-file:
    description: Path of report.json, empty when it was not written.
    value: ${{ steps.run.outputs.report-file }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      run: '"$GITHUB_ACTION_PATH/run.sh"'
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_ENV: ${{ inputs.env }}
        INPUT_ENV_FILE: ${{ inputs.env-file }}
        INPUT_REPORTER: ${{ inputs.reporter }}
        INPUT_OUT: ${{ inputs.out }}
        INPUT_SECRETS: ${{ inputs.secrets }}
        INPUT_VARS: ${{ inputs.vars }}
        INPUT_ARGS: ${{ inputs.args }}

    - if: always() && inputs.artifact-name != '' && steps.run.outputs.junit-file != ''
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.run.outputs.junit-file }}
        if-no-files-found: ignore

    - if: always()
      uses: actions/github-script@v9
      env:
        HITOP_EXIT_CODE: ${{ steps.run.outputs.exit-code }}
        HITOP_REPORT_FILE: ${{ steps.run.outputs.report-file }}
        HITOP_VERSION: ${{ inputs.version }}
        HITOP_SUMMARY: ${{ inputs.summary }}
        HITOP_ACTION_PATH: ${{ steps.run.outputs.action-path || github.action_path }}
      with:
        script: |
          const finish = require(process.env.HITOP_ACTION_PATH + '/summary.js');
          await finish({ core, env: process.env });
